<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Cyber Snake - Classic Arcade Game</title>
  
  <!-- SEO & Social Meta Tags (Siap Vercel & GitHub) -->
  <meta name="description" content="Classic Retro Arcade Snake Game dengan kontrol keyboard & sentuh (Mobile-First), audio synthesizer 8-bit, dan skor tersimpan.">
  <meta name="theme-color" content="#0a0e17">
  <meta property="og:title" content="Retro Cyber Snake Game">
  <meta property="og:description" content="Mainkan game ular klasik dengan grafis neon retro modern langsung di browser HP maupun Desktop!">
  <meta property="og:type" content="website">

  <!-- Favicon SVG Data URI (Mandiri tanpa file eksternal) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0e17'/><circle cx='50' cy='50' r='35' fill='%2310b981'/><circle cx='62' cy='42' r='6' fill='%23042f2e'/><circle cx='62' cy='58' r='6' fill='%23042f2e'/></svg>">

  <!-- Google Fonts: Pixel font & Modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      --bg-dark: #080c14;
      --surface-card: rgba(15, 23, 42, 0.75);
      --surface-border: rgba(56, 189, 248, 0.18);
      
      --neon-emerald: #10b981;
      --neon-emerald-glow: rgba(16, 185, 129, 0.45);
      --neon-ruby: #f43f5e;
      --neon-ruby-glow: rgba(244, 63, 94, 0.55);
      --neon-cyan: #38bdf8;
      --neon-amber: #f59e0b;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-retro: 'Press Start 2P', monospace;
      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-body);
      color: var(--text-main);
    }

    /* Latar Belakang Cyber Grid */
    body {
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 85%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }

    /* Container Utama yang Responsif (Mobile-First) */
    .app-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: auto 0;
    }

    /* ==========================================================================
       2. HEADER & SCOREBOARD
       ========================================================================== */
    .game-header {
      text-align: center;
      width: 100%;
    }

    .brand-title {
      font-family: var(--font-retro);
      font-size: clamp(1.2rem, 4.5vw, 1.7rem);
      color: var(--neon-emerald);
      text-shadow: 0 0 10px var(--neon-emerald-glow), 0 0 20px var(--neon-emerald-glow);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .score-card {
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s;
    }

    .score-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .score-label {
      font-family: var(--font-retro);
      font-size: 0.52rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .score-val {
      font-family: var(--font-retro);
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 700;
      color: var(--text-main);
    }

    .score-val.current { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
    .score-val.high { color: var(--neon-amber); text-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .score-val.speed { color: var(--neon-emerald); }

    /* ==========================================================================
       3. CANVAS ARENA (Tepat di Tengah & Auto Scale)
       ========================================================================== */
    .arena-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #040711;
      border: 2px solid rgba(16, 185, 129, 0.5);
      border-radius: 16px;
      box-shadow: 
        0 0 24px rgba(16, 185, 129, 0.15),
        inset 0 0 30px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      touch-action: none; /* Mencegah pull-to-refresh saat swipe di canvas */
    }

    #snakeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* Modal Overlays (Ready, Paused, Game Over) */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 17, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-title {
      font-family: var(--font-retro);
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .modal-title.ready { color: var(--neon-emerald); text-shadow: 0 0 12px var(--neon-emerald-glow); }
    .modal-title.over { color: var(--neon-ruby); text-shadow: 0 0 12px var(--neon-ruby-glow); }
    .modal-title.paused { color: var(--neon-cyan); }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 280px;
    }

    .record-pill {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--neon-amber);
      color: var(--neon-amber);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
      animation: bounce 1.4s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ==========================================================================
       4. ACTION BUTTONS & DESKTOP CONTROLS
       ========================================================================== */
    .action-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      font-family: var(--font-retro);
      font-size: 0.72rem;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      transition: transform 0.1s, box-shadow 0.15s, background-color 0.15s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .btn-emerald:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.55);
    }

    .btn-ghost {
      background: rgba(30, 41, 59, 0.7);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .btn-ghost:hover {
      background: rgba(51, 65, 85, 0.85);
      border-color: rgba(148, 163, 184, 0.5);
    }

    /* Desktop Hint */
    .desktop-hint {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .kbd {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 5px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #e2e8f0;
    }

    /* ==========================================================================
       5. VIRTUAL TOUCH D-PAD (MOBILE FIRST)
       ========================================================================== */
    .touch-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 4px;
      touch-action: manipulation;
    }

    .dpad-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .dpad-btn {
      width: 58px;
      height: 52px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      touch-action: manipulation;
      transition: transform 0.08s, background-color 0.12s, border-color 0.12s;
    }

    .dpad-btn:active, .dpad-btn.pressed {
      background: var(--neon-emerald);
      color: #022c22;
      border-color: var(--neon-emerald);
      transform: scale(0.92);
      box-shadow: 0 0 14px var(--neon-emerald-glow);
    }

    /* Responsivitas Tinggi: Jika layar HP sangat pendek (landscape / small phone) */
    @media (max-height: 650px) {
      body { padding: 6px 12px; }
      .app-container { gap: 6px; }
      .brand-title { font-size: 1rem; margin-bottom: 2px; }
      .score-card { padding: 4px 8px; }
      .arena-wrapper { max-width: 280px; }
      .dpad-btn { width: 48px; height: 44px; font-size: 1.1rem; }
    }

    /* Tampilkan hint keyboard hanya di desktop/tablet */
    @media (pointer: coarse) {
      .desktop-hint { display: none; }
    }
  </style>
</head>
<body>

  <main class="app-container">
    <!-- Header Brand -->
    <header class="game-header">
      <h1 class="brand-title">CYBER SNAKE</h1>
    </header>

    <!-- Scoreboard (Skor Saat Ini, Skor Tertinggi, Level Kecepatan) -->
    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card">
        <span class="score-label">SKOR</span>
        <span id="scoreDisplay" class="score-val current">0</span>
      </div>
      <div class="score-card">
        <span class="score-label">TERTINGGI</span>
        <span id="highScoreDisplay" class="score-val high">0</span>
      </div>
      <div class="score-card">
        <span class="score-label">LEVEL</span>
        <span id="speedDisplay" class="score-val speed">1</span>
      </div>
    </section>

    <!-- Canvas Game Arena (Terpusat & Responsif) -->
    <div class="arena-wrapper" id="arenaWrapper">
      <canvas id="snakeCanvas" width="400" height="400" role="img" aria-label="Area permainan ular"></canvas>

      <!-- Modal Layar Mulai (Ready) -->
      <div id="modalStart" class="modal-overlay">
        <h2 class="modal-title ready">READY?</h2>
        <p class="modal-desc">Makan apel neon untuk menambah panjang dan raih skor tertinggi!</p>
        <button id="btnStartGame" class="btn btn-emerald">MULAI MAIN</button>
      </div>

      <!-- Modal Layar Jeda (Paused) -->
      <div id="modalPause" class="modal-overlay hidden">
        <h2 class="modal-title paused">PAUSED</h2>
        <p class="modal-desc">Permainan sedang dijeda.</p>
        <button id="btnResumeGame" class="btn btn-emerald">LANJUTKAN</button>
      </div>

      <!-- Modal Layar Game Over -->
      <div id="modalGameOver" class="modal-overlay hidden">
        <h2 class="modal-title over">GAME OVER</h2>
        <div id="newRecordPill" class="record-pill" style="display: none;">🏆 REKOR BARU TERCIPTA!</div>
        <p class="modal-desc" id="finalScoreDesc">Skor Akhir: 0</p>
        <button id="btnRestartGame" class="btn btn-emerald">MAIN LAGI</button>
      </div>
    </div>

    <!-- Tombol Aksi Permainan -->
    <section class="action-bar">
      <button id="btnMainAction" class="btn btn-emerald">Start</button>
      <button id="btnPauseGame" class="btn btn-ghost">Pause</button>
      <button id="btnAudioToggle" class="btn btn-ghost" title="Nyalakan/Matikan Suara">🔊 On</button>
    </section>

    <!-- Navigasi Sentuh Layar HP (Mobile Touch D-Pad) -->
    <nav class="touch-controls" aria-label="Kontrol Layar Sentuh">
      <div class="dpad-row">
        <button id="btnUp" class="dpad-btn" aria-label="Atas">▲</button>
      </div>
      <div class="dpad-row">
        <button id="btnLeft" class="dpad-btn" aria-label="Kiri">◀</button>
        <button id="btnDown" class="dpad-btn" aria-label="Bawah">▼</button>
        <button id="btnRight" class="dpad-btn" aria-label="Kanan">▶</button>
      </div>
    </nav>

    <!-- Petunjuk Tombol Keyboard untuk Desktop -->
    <footer class="desktop-hint">
      <span>Kontrol: <span class="kbd">WASD</span> / <span class="kbd">↑↓←→</span></span>
      <span>Jeda: <span class="kbd">Spasi</span></span>
    </footer>
  </main>

  <script>
    /**
     * ========================================================================
     * RETRO CYBER SNAKE GAME - STANDALONE SCRIPT
     * Architecture:
     * 1. AudioSynthesizer (Web Audio API sound generator)
     * 2. Game Engine & State Management (Reset, Loop, Collision)
     * 3. Canvas Rendering (Pixel Grid, Glowing Elements, Particles)
     * 4. Multi-Input Handling (Desktop Keyboard, Touch D-pad, Swipe gestures)
     * ========================================================================
     */

    // --- 1. AUDIO SYNTHESIZER (8-BIT WEB AUDIO API) ---
    const SoundFX = {
      audioCtx: null,
      isMuted: false,

      init() {
        if (!this.audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.audioCtx = new AudioContextClass();
          }
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      },

      playBeep(frequency, waveType = 'square', duration = 0.08, volume = 0.12) {
        if (this.isMuted) return;
        try {
          this.init();
          if (!this.audioCtx) return;

          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();

          osc.type = waveType;
          osc.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);

          gain.gain.setValueAtTime(volume, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          osc.start();
          osc.stop(this.audioCtx.currentTime + duration);
        } catch (e) {
          // Abaikan jika browser membatasi autoplay
        }
      },

      eat() {
        this.playBeep(520, 'square', 0.05, 0.12);
        setTimeout(() => this.playBeep(780, 'square', 0.08, 0.14), 50);
      },

      gameOver() {
        this.playBeep(300, 'sawtooth', 0.12, 0.18);
        setTimeout(() => this.playBeep(200, 'sawtooth', 0.18, 0.20), 120);
        setTimeout(() => this.playBeep(120, 'sawtooth', 0.35, 0.22), 280);
      },

      move() {
        this.playBeep(260, 'triangle', 0.02, 0.03);
      },

      newRecord() {
        const arpeggio = [523, 659, 784, 1046];
        arpeggio.forEach((note, index) => {
          setTimeout(() => this.playBeep(note, 'sine', 0.12, 0.15), index * 90);
        });
      }
    };

    // --- 2. GAME ENGINE & LOGIC ---
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    // Grid Matrix: 20 x 20 petak
    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20

    // Parameter Kecepatan (milidetik per tick)
    const SPEED_INITIAL = 135;
    const SPEED_MINIMUM = 55;
    const SPEED_STEP = 3;

    // State Variables
    let gameState = 'READY'; // 'READY' | 'PLAYING' | 'PAUSED' | 'GAMEOVER'
    let snake = [];
    let direction = { x: 1, y: 0 };
    let pendingDirection = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_snake_highscore') || '0', 10);
    let currentSpeed = SPEED_INITIAL;
    let gameTimer = null;
    let particles = [];
    let pulseScale = 0;

    // DOM References
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const btnMainAction = document.getElementById('btnMainAction');
    const btnPauseGame = document.getElementById('btnPauseGame');
    const btnAudioToggle = document.getElementById('btnAudioToggle');

    const modalStart = document.getElementById('modalStart');
    const modalPause = document.getElementById('modalPause');
    const modalGameOver = document.getElementById('modalGameOver');
    const newRecordPill = document.getElementById('newRecordPill');
    const finalScoreDesc = document.getElementById('finalScoreDesc');
    const arenaWrapper = document.getElementById('arenaWrapper');

    // Tampilkan High Score Awal
    highScoreDisplay.textContent = highScore;

    /**
     * Inisialisasi ulang seluruh variabel state game secara sempurna
     */
    function resetGameState() {
      // Posisi ular awal: 3 segmen mengarah ke kanan di tengah canvas
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      pendingDirection = { x: 1, y: 0 };
      score = 0;
      currentSpeed = SPEED_INITIAL;
      particles = [];
      updateScoreboardUI();
      spawnFood();
    }

    /**
     * Memunculkan makanan di koordinat acak yang tidak terkena badan ular
     */
    function spawnFood() {
      let isOccupied = true;
      let newCoord = { x: 0, y: 0 };

      while (isOccupied) {
        newCoord.x = Math.floor(Math.random() * TILE_COUNT);
        newCoord.y = Math.floor(Math.random() * TILE_COUNT);
        // Validasi: pastikan tidak tumpang tindih dengan tubuh ular
        isOccupied = snake.some(seg => seg.x === newCoord.x && seg.y === newCoord.y);
      }
      food = newCoord;
    }

    /**
     * Menambahkan partikel neon saat makanan dimakan
     */
    function emitParticles(tileX, tileY) {
      const originX = tileX * GRID_SIZE + GRID_SIZE / 2;
      const originY = tileY * GRID_SIZE + GRID_SIZE / 2;
      for (let i = 0; i < 14; i++) {
        const rad = (Math.PI * 2 * i) / 14;
        const velocity = 1.2 + Math.random() * 2.8;
        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(rad) * velocity,
          vy: Math.sin(rad) * velocity,
          alpha: 1,
          size: 2 + Math.random() * 3,
          color: Math.random() > 0.4 ? '#f43f5e' : '#fbbf24'
        });
      }
    }

    /**
     * Memulai atau merestart siklus permainan
     */
    function startOrRestartGame() {
      SoundFX.init();
      if (gameTimer) clearTimeout(gameTimer);

      resetGameState();
      gameState = 'PLAYING';

      btnMainAction.textContent = 'Restart';
      btnPauseGame.disabled = false;
      btnPauseGame.textContent = 'Pause';

      // Sembunyikan seluruh modal
      modalStart.classList.add('hidden');
      modalPause.classList.add('hidden');
      modalGameOver.classList.add('hidden');

      runGameTick();
    }

    /**
     * Toggle status pause
     */
    function togglePauseGame() {
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        modalPause.classList.remove('hidden');
        btnPauseGame.textContent = 'Resume';
      } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        modalPause.classList.add('hidden');
        btnPauseGame.textContent = 'Pause';
        runGameTick();
      }
    }

    /**
     * Siklus saat Ular Game Over (Menabrak dinding atau badan sendiri)
     */
    function triggerGameOver() {
      gameState = 'GAMEOVER';
      SoundFX.gameOver();
      btnMainAction.textContent = 'Restart';
      btnPauseGame.disabled = true;

      let isNewRecord = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cyber_snake_highscore', highScore.toString());
        highScoreDisplay.textContent = highScore;
        isNewRecord = true;
        setTimeout(() => SoundFX.newRecord(), 250);
      }

      finalScoreDesc.textContent = `Skor Akhir: ${score}`;
      newRecordPill.style.display = isNewRecord ? 'inline-block' : 'none';
      modalGameOver.classList.remove('hidden');
    }

    /**
     * Logika update posisi ular dan deteksi tabrakan
     */
    function updateGameLogic() {
      // Terapkan arah yang telah divalidasi
      direction = { ...pendingDirection };

      // Kalkulasi koordinat kepala baru
      const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // 1. Deteksi Tabrakan Dinding
      if (newHead.x < 0 || newHead.x >= TILE_COUNT || newHead.y < 0 || newHead.y >= TILE_COUNT) {
        triggerGameOver();
        return;
      }

      // 2. Deteksi Tabrakan Badan Sendiri
      for (let i = 0; i < snake.length; i++) {
        if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
          triggerGameOver();
          return;
        }
      }

      // Sisipkan kepala baru ke depan array
      snake.unshift(newHead);

      // 3. Deteksi Makan Apel
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        SoundFX.eat();
        emitParticles(food.x, food.y);

        // Akselerasi kecepatan permainan secara halus
        if (currentSpeed > SPEED_MINIMUM) {
          currentSpeed = Math.max(SPEED_MINIMUM, currentSpeed - SPEED_STEP);
        }

        // Live update High Score jika melampaui rekor
        if (score > highScore) {
          highScore = score;
          highScoreDisplay.textContent = highScore;
          localStorage.setItem('cyber_snake_highscore', highScore.toString());
        }

        updateScoreboardUI();
        spawnFood();
      } else {
        // Hapus ekor jika tidak makan
        snake.pop();
      }
    }

    /**
     * Update tampilan teks scoreboard
     */
    function updateScoreboardUI() {
      scoreDisplay.textContent = score;
      // Konversi kecepatan menjadi representasi Level 1-10
      const currentLevel = Math.min(10, Math.floor((SPEED_INITIAL - currentSpeed) / 8) + 1);
      speedDisplay.textContent = currentLevel;
    }

    // --- 3. CANVAS RENDERING ---
    function renderGameScene() {
      // 1. Bersihkan Canvas dengan latar belakang gelap
      ctx.fillStyle = '#060a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Gambar Garis Grid Retro
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, x);
        ctx.lineTo(canvas.width, x);
        ctx.stroke();
      }

      // 3. Render Partikel Ledakan
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.045;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 4. Render Apel Bersinar (Pulsing Glow)
      pulseScale += 0.09;
      const radius = (GRID_SIZE / 2 - 2) + Math.sin(pulseScale) * 1.5;
      const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const fy = food.y * GRID_SIZE + GRID_SIZE / 2;

      ctx.save();
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(fx, fy, Math.max(3, radius), 0, Math.PI * 2);
      ctx.fill();

      // Kilau cahaya apel
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(fx - 2, fy - 2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 5. Render Segmen Ular
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const isHead = (i === 0);

        ctx.save();
        if (isHead) {
          // Kepala Neon Hijau Terang dengan Glow
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 12;

          ctx.beginPath();
          ctx.roundRect(
            seg.x * GRID_SIZE + 1.5,
            seg.y * GRID_SIZE + 1.5,
            GRID_SIZE - 3,
            GRID_SIZE - 3,
            6
          );
          ctx.fill();

          // Mata Ular (Orientasi sesuai arah pergerakan)
          ctx.fillStyle = '#022c22';
          let eye1X, eye1Y, eye2X, eye2Y;
          const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
          const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;

          if (direction.x === 1) { // Menghadap Kanan
            eye1X = cx + 3; eye1Y = cy - 4;
            eye2X = cx + 3; eye2Y = cy + 4;
          } else if (direction.x === -1) { // Menghadap Kiri
            eye1X = cx - 3; eye1Y = cy - 4;
            eye2X = cx - 3; eye2Y = cy + 4;
          } else if (direction.y === 1) { // Menghadap Bawah
            eye1X = cx - 4; eye1Y = cy + 3;
            eye2X = cx + 4; eye2Y = cy + 3;
          } else { // Menghadap Atas
            eye1X = cx - 4; eye1Y = cy - 3;
            eye2X = cx + 4; eye2Y = cy - 3;
          }

          ctx.beginPath();
          ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
          ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Tubuh Ular: Gradasi Hijau Neon
          const ratio = i / snake.length;
          const greenTone = Math.floor(185 - ratio * 45);
          ctx.fillStyle = `rgb(16, ${greenTone}, 129)`;
          ctx.shadowColor = 'rgba(16, 185, 129, 0.25)';
          ctx.shadowBlur = 5;

          ctx.beginPath();
          ctx.roundRect(
            seg.x * GRID_SIZE + 2,
            seg.y * GRID_SIZE + 2,
            GRID_SIZE - 4,
            GRID_SIZE - 4,
            4
          );
          ctx.fill();
        }
        ctx.restore();
      }
    }

    /**
     * Game Loop Tick
     */
    function runGameTick() {
      if (gameState !== 'PLAYING') return;
      updateGameLogic();
      renderGameScene();
      if (gameState === 'PLAYING') {
        gameTimer = setTimeout(runGameTick, currentSpeed);
      }
    }

    // --- 4. MULTI-INPUT HANDLING (KEYBOARD & TOUCH) ---
    function setDirection(dx, dy) {
      if (gameState === 'READY') {
        startOrRestartGame();
      }
      if (gameState !== 'PLAYING') return;

      // Larang gerakan berbalik arah 180° secara langsung
      if (dx !== 0 && direction.x !== 0) return;
      if (dy !== 0 && direction.y !== 0) return;

      if (pendingDirection.x !== dx || pendingDirection.y !== dy) {
        SoundFX.move();
      }

      pendingDirection = { x: dx, y: dy };
    }

    // Keyboard Listener
    window.addEventListener('keydown', (e) => {
      // Shortcut Spasi / P untuk Pause atau Start
      if (e.code === 'Space' || e.code === 'KeyP') {
        e.preventDefault();
        if (gameState === 'READY' || gameState === 'GAMEOVER') {
          startOrRestartGame();
        } else {
          togglePauseGame();
        }
        return;
      }

      // Shortcut Enter untuk Start / Restart
      if (e.code === 'Enter') {
        e.preventDefault();
        startOrRestartGame();
        return;
      }

      // Kontrol Arah Panah & WASD
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault();
          setDirection(0, -1);
          break;

        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault();
          setDirection(0, 1);
          break;

        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault();
          setDirection(-1, 0);
          break;

        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault();
          setDirection(1, 0);
          break;
      }
    });

    // Touch D-Pad Listener (Layar Sentuh HP)
    const bindTouchButton = (btnId, dx, dy) => {
      const element = document.getElementById(btnId);
      const handlePress = (e) => {
        e.preventDefault();
        element.classList.add('pressed');
        setDirection(dx, dy);
      };
      const handleRelease = () => {
        element.classList.remove('pressed');
      };

      element.addEventListener('pointerdown', handlePress);
      element.addEventListener('pointerup', handleRelease);
      element.addEventListener('pointerleave', handleRelease);
    };

    bindTouchButton('btnUp', 0, -1);
    bindTouchButton('btnDown', 0, 1);
    bindTouchButton('btnLeft', -1, 0);
    bindTouchButton('btnRight', 1, 0);

    // Gestur Swipe pada Arena Canvas (Opsional untuk kenyamanan ekstra di layar sentuh)
    let touchStartX = 0;
    let touchStartY = 0;

    arenaWrapper.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });

    arenaWrapper.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY) return;
      const t = e.changedTouches[0];
      const diffX = t.clientX - touchStartX;
      const diffY = t.clientY - touchStartY;
      const threshold = 25; // Piksel minimum swipe

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > threshold) {
          setDirection(diffX > 0 ? 1 : -1, 0);
        }
      } else {
        if (Math.abs(diffY) > threshold) {
          setDirection(0, diffY > 0 ? 1 : -1);
        }
      }
      touchStartX = 0;
      touchStartY = 0;
    }, { passive: true });

    // UI Buttons Listener
    document.getElementById('btnStartGame').addEventListener('click', startOrRestartGame);
    document.getElementById('btnRestartGame').addEventListener('click', startOrRestartGame);
    document.getElementById('btnResumeGame').addEventListener('click', togglePauseGame);

    btnMainAction.addEventListener('click', startOrRestartGame);
    btnPauseGame.addEventListener('click', togglePauseGame);

    // Sound Toggle
    btnAudioToggle.addEventListener('click', () => {
      SoundFX.isMuted = !SoundFX.isMuted;
      btnAudioToggle.textContent = SoundFX.isMuted ? '🔇 Off' : '🔊 On';
      if (!SoundFX.isMuted) SoundFX.init();
    });

    // Inisialisasi Tampilan Awal Sebelum Game Berjalan
    resetGameState();
    renderGameScene();
  </script>
</body>
</html>
